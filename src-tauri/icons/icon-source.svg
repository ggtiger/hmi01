<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081A29"/>
      <stop offset="0.55" stop-color="#0B3A4D"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FBFF"/>
      <stop offset="1" stop-color="#C3EBFF"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 底板：深蓝青渐变圆角方形 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- 背景刻度网格（仪表感，低调） -->
  <g opacity="0.10" stroke="#9BE8FF" stroke-width="4">
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="256" y1="0" x2="256" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
  </g>

  <!-- 检测波形（顶部，青色发光） -->
  <polyline
    points="150,300 300,300 350,238 412,362 472,268 522,300 880,300"
    fill="none" stroke="url(#wave)" stroke-width="34"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- 方向盘：外圈 + 中心 + 三辐条 -->
  <circle cx="512" cy="646" r="222" fill="none" stroke="url(#ring)" stroke-width="46"/>
  <circle cx="512" cy="646" r="94" fill="none" stroke="url(#ring)" stroke-width="40"/>
  <g stroke="url(#ring)" stroke-width="40" stroke-linecap="round">
    <line x1="512" y1="552" x2="512" y2="424"/>
    <line x1="433" y1="691" x2="308" y2="764"/>
    <line x1="591" y1="691" x2="716" y2="764"/>
  </g>

  <!-- 底部仪表刻度 -->
  <g stroke="#7FD8FF" stroke-width="12" stroke-linecap="round" opacity="0.7">
    <line x1="352" y1="938" x2="672" y2="938"/>
    <line x1="392" y1="968" x2="632" y2="968" opacity="0.55"/>
  </g>
</svg>
